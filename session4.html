<style id="cinema-style">

  }
  .cinema-play{
    width:28px;height:28px;border-radius:50%;

  .cinema-overlay{

    pointer-events:none;
    transition:opacity .35s ease,visibility .35s ease;
  }
  .cinema-overlay.is-open{

  }

  }
  .cinema-stage{
    position:absolute;

  }
  .cinema-photo-wrap{
    width:100%;height:100%;
    display:grid;place-items:center;
  }

    max-width:100%;
    max-height:100%;
    width:auto;height:auto;
    object-fit:contain;
    border-radius:4px;
    box-shadow:0 22px 80px rgba(0,0,0,.42);
    user-select:none;
    -webkit-user-drag:none;
    opacity:0;
    transform:scale(.985);
    transition:opacity .35s ease,transform .45s ease;
  }
  .cinema-photo-wrap img.is-visible{
    opacity:1;
    transform:scale(1);
  }
  .cinema-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);

    width:48px;height:72px;

<script>
(()=>{const items=[...document.querySelectorAll('.gallery-item')],box=document.querySelector('.gallery-lightbox'),img=document.querySelector('#galleryViewer'),counter=document.querySelector('#galleryCounter'),dl=document.querySelector('.lightbox-download');let i=0;
function show(n){i=(n+items.length)%items.length;img.src=items[i].dataset.src;dl.href=items[i].dataset.src;counter.textContent=(i+1)+' / '+items.length;box.classList.add('open');document.body.style.overflow='hidden'}
function close(){box.classList.remove('open');document.body.style.overflow=''}
items.forEach((el,n)=>el.addEventListener('click',e=>{if(!e.target.closest('.download-mini'))show(n)}));
document.querySelector('.lightbox-close').onclick=close;document.querySelector('.lightbox-prev').onclick=()=>show(i-1);document.querySelector('.lightbox-next').onclick=()=>show(i+1);
document.addEventListener('keydown',e=>{if(!box.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});box.onclick=e=>{if(e.target===box)close()};})();
</script>
<script id="cinema-script">
(function(){
  const images = ["images/sessions/session4/1023654190323935086.jpg", "images/sessions/session4/1113092864237870432.jpg", "images/sessions/session4/1fb8f3d4954ae157a373582797ffbb6a.jpg", "images/sessions/session4/295337688085142286.jpg", "images/sessions/session4/368098969565459644.jpg", "images/sessions/session4/4777.jpg", "images/sessions/session4/478648266667275761.jpg", "images/sessions/session4/50f9b194e47b8446e0b0f169a042e5d5.jpg", "images/sessions/session4/546131892330156063.jpg", "images/sessions/session4/554927985360550297.jpg", "images/sessions/session4/574701602467697040.jpg", "images/sessions/session4/635711303695631718.jpg", "images/sessions/session4/726346246187078344.jpg", "images/sessions/session4/74.jpg", "images/sessions/session4/744571750938480087.jpg", "images/sessions/session4/778067273151257446.jpg", "images/sessions/session4/779193173073486651.jpg", "images/sessions/session4/860398703859661736.jpg", "images/sessions/session4/8d018a4ceef7155df6751d837b819087.jpg", "images/sessions/session4/bridal portraits.jpg", "images/sessions/session4/bride &amp; groom.jpg", "images/sessions/session4/bride and groom.jpg", "images/sessions/session4/c36bf97edb9dba54ca70939c4e86f652.jpg", "images/sessions/session4/c6f9249742b3d51dc9673c4b4163125e.jpg", "images/sessions/session4/ddb80ec862a6578708c1de3d818067ae.jpg", "images/sessions/session4/f1e3f9e9a3715e976e13115fb7f060fd.jpg", "images/sessions/session4/Timeless Black &amp; White Wedding Photography _ Elegant Couple Editorial Moment.jpg", "images/sessions/session4/Wedding photo inspo.jpg", "images/sessions/session4/Wedding photos.jpg", "images/sessions/session4/Wedding pictures.jpg"];
  const overlay = document.getElementById('cinemaOverlay');
  const launch = document.getElementById('cinemaLaunch');
  const closeBtn = document.getElementById('cinemaClose');
  const prevBtn = document.getElementById('cinemaPrev');
  const nextBtn = document.getElementById('cinemaNext');
  const playBtn = document.getElementById('cinemaPlay');
  const downloadBtn = document.getElementById('cinemaDownload');
  const photo = document.getElementById('cinemaPhoto');
  const counter = document.getElementById('cinemaCounter');
  const progress = document.getElementById('cinemaProgress');

  if(!overlay || !launch || !photo) return;

  let current = 0;
  let playing = true;
  let timer = null;
  const DURATION = 4200;

  function render(){
    photo.classList.remove('is-visible');
    const nextSrc = images[current];
    photo.onload = () => requestAnimationFrame(() => photo.classList.add('is-visible'));
    photo.src = nextSrc;
    photo.alt = 'السيشن 4 — صورة ' + (current + 1);
    counter.textContent = (current + 1) + ' / ' + images.length;
    progress.style.width = (((current + 1) / images.length) * 100) + '%';
  }

  function stopTimer(){
    if(timer) clearTimeout(timer);
    timer = null;
  }

  function schedule(){
    stopTimer();
    if(!playing) return;
    timer = setTimeout(() => {
      current = (current + 1) % images.length;
      render();
      schedule();
    }, DURATION);
  }

  function openCinema(){
    current = 0;
    playing = true;
    playBtn.textContent = 'Ⅱ';
    overlay.classList.add('is-open');
    overlay.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    render();
    schedule();
  }

  function closeCinema(){
    stopTimer();
    overlay.classList.remove('is-open');
    overlay.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }

  function go(delta){
    current = (current + delta + images.length) % images.length;
    render();
    schedule();
  }

  launch.addEventListener('click', openCinema);
  closeBtn.addEventListener('click', closeCinema);
  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));

  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? 'Ⅱ' : '▶';
    schedule();
  });

  downloadBtn.addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = images[current];
    a.download = images[current].split('/').pop() || 'photo.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  document.addEventListener('keydown', (e) => {
    if(!overlay.classList.contains('is-open')) return;
    if(e.key === 'Escape') closeCinema();
    else if(e.key === 'ArrowRight') go(1);
    else if(e.key === 'ArrowLeft') go(-1);
    else if(e.code === 'Space') {
      e.preventDefault();
      playBtn.click();
    }
  });

  // Swipe support on mobile.
  let touchX = null;
  overlay.addEventListener('touchstart', e => {
    touchX = e.changedTouches[0].clientX;
  }, {passive:true});
  overlay.addEventListener('touchend', e => {
    if(touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if(Math.abs(dx) > 45) go(dx < 0 ? 1 : -1);
  }, {passive:true});
})();
</script>

</body></html>
